[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecoder"
version = "0.0.1"
description = "Orquestador multiagente neutral respecto al proveedor de IA"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.26,<1",
    "pydantic>=1.10.14,<3",
]

[project.scripts]
vibecoder = "vibecoder.cli:main"
vibecoderd = "vibecoder.daemon:main"
vibecoder-worker-launcherd = "vibecoder.worker_launcher_service:main"

[tool.setuptools.packages.find]
include = ["vibecoder*"]

[tool.setuptools.package-data]
vibecoder = ["migrations/*.sql", "plugin_descriptors/*.json"]

