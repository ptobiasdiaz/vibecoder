[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecoder-m00"
version = "0.1.0"
description = "Experimentos reproducibles para Codex App Server"
requires-python = ">=3.11"

[project.scripts]
vibecoder-m00-diagnose = "m00_codex.diagnostic:main"

[tool.setuptools.packages.find]
include = ["m00_codex*"]

